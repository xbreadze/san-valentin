<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Para Ti ❤️</title>

    <!-- IMPORTANTE para celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;
            overflow: hidden;
        }

        h1 {
            margin-top: 80px;
            font-size: 2.2em;
        }

        h2 {
            margin-top: 20px;
            font-size: 1.6em;
        }

        button {
            font-size: 1.2em;
            padding: 15px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            position: absolute;
        }

        .si {
            background-color: #ff4d6d;
            color: white;
            left: 50%;
            top: 320px;
            transform: translateX(-130px);
        }

        .no {
            background-color: white;
            color: #ff4d6d;
            left: 50%;
            top: 320px;
            transform: translateX(40px);
        }
    </style>
</head>

<body>

<h1>💖 Tengo una pregunta para ti 💖</h1>
<h2>¿Quieres ser mi San Valentín? 🌹</h2>

<button class="si" onclick="acepta()">Sí 💕</button>
<button class="no" id="btnNo">No 🙈</button>

<script>
const btnNo = document.getElementById("btnNo");

// PC
btnNo.addEventListener("mouseover", moverBoton);

// CELULAR
btnNo.addEventListener("touchstart", moverBoton);

function moverBoton() {
    const x = Math.random() * (window.innerWidth - btnNo.offsetWidth);
    const y = Math.random() * (window.innerHeight - btnNo.offsetHeight);

    btnNo.style.left = x + "px";
    btnNo.style.top = y + "px";
}

function acepta() {
    document.body.innerHTML = `
        <h1>💘 Sabía que dirías que sí 💘</h1>
        <h2>Gracias por hacerme el más feliz ❤️</h2>
        <p>Feliz San Valentín 🌹</p>
    `;
}
</script>

</body>
</html>
